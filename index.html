<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6a51">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="문서 보기">
<title>문서 보기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic&family=Nanum+Myeongjo&display=swap">
<style>
/* Layout: one calm column at home; a sticky toolbar over a stack of white paper pages when reading. */
:root {
  --bg: #edf1ee;
  --surface: #ffffff;
  --fg: #16201b;
  --muted: #4b5952;
  --line: #c9d3cd;
  --accent: #1d6a51;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe4;
  --warn-bg: #fbeee6;
  --warn-fg: #8a3510;
  --paper: #ffffff;
  --shadow: 0 1px 2px rgb(22 32 27 / .10), 0 6px 18px rgb(22 32 27 / .08);
  --display: "Gowun Batang", "Noto Serif KR", serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111714; --surface: #1a221e; --fg: #e8eeea; --muted: #a9b7af; --line: #33403a;
    --accent: #63c49d; --accent-ink: #0b1712; --accent-soft: #1f3a2f;
    --warn-bg: #3a2216; --warn-fg: #ffc4a3;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111714; --surface: #1a221e; --fg: #e8eeea; --muted: #a9b7af; --line: #33403a;
  --accent: #63c49d; --accent-ink: #0b1712; --accent-soft: #1f3a2f;
  --warn-bg: #3a2216; --warn-fg: #ffc4a3;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 20px; line-height: 1.6;
  word-break: keep-all; overflow-wrap: anywhere;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
button, label.btn { font: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 10px; }

/* ---------- Home ---------- */
.home {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 36px 56px;
  display: flex; flex-direction: column; gap: 28px;
}
.brand { display: flex; flex-direction: column; gap: 6px; }
.brand h1 {
  margin: 0; font-family: var(--display); font-weight: 700;
  font-size: 2.1rem; line-height: 1.25; text-wrap: balance; letter-spacing: -0.01em;
}
.brand p { margin: 0; color: var(--muted); font-size: 1.1rem; }

.pick {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  min-height: 112px; padding: 20px;
  background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 22px; cursor: pointer;
  font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em;
  box-shadow: var(--shadow);
  transition: transform .12s ease, filter .12s ease;
}
.pick:hover { filter: brightness(1.06); }
.pick:active { transform: scale(.985); }
.pick svg { width: 44px; height: 44px; flex: none; }
.drop-hint { margin: -14px 0 0; text-align: center; color: var(--muted); font-size: .95rem; }
body.dragging .pick { outline: 4px dashed var(--accent); outline-offset: 6px; }

.sample {
  align-self: center; background: none; border: 2px solid var(--line); color: var(--fg);
  border-radius: 999px; padding: 12px 24px; min-height: 56px; cursor: pointer; font-size: 1.05rem;
}
.sample:hover { border-color: var(--accent); }

.block h2 {
  margin: 0 0 12px; font-size: 1.15rem; font-weight: 700; color: var(--fg);
}
.kinds { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.kinds li {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 18px;
}
.kinds b { font-weight: 500; }
.kinds span { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; white-space: nowrap; }

.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; counter-increment: s; }
.steps li::before {
  content: counter(s); display: grid; place-items: center; width: 40px; height: 40px;
  border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700;
}
.steps li > div { padding-top: 3px; min-width: 0; }

.safe {
  display: flex; gap: 14px; align-items: flex-start;
  background: var(--accent-soft); border-radius: 16px; padding: 18px 20px; font-size: 1rem;
}
.safe svg { width: 28px; height: 28px; flex: none; color: var(--accent); margin-top: 2px; }

.home { box-sizing: border-box; min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); justify-content: center; align-items: stretch; text-align: center; padding-block: 24px; }
.title { margin: 0; font-family: var(--display); font-weight: 700; font-size: 2.4rem; }
.pick { min-height: 140px; font-size: 2rem; }
.hint { margin: 0; color: var(--muted); font-size: 1.05rem; }
.bar { justify-content: space-between; }

/* ---------- Viewer ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
}
.bar .name {
  flex: 1 1 160px; min-width: 0; font-weight: 700; font-size: 1.05rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tbtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 56px; min-width: 56px; padding: 0 16px;
  background: var(--bg); color: var(--fg); border: 2px solid var(--line);
  border-radius: 14px; cursor: pointer; font-size: 1.05rem; font-weight: 500;
}
.tbtn:hover { border-color: var(--accent); }
.tbtn:disabled { opacity: .4; cursor: default; }
.tbtn svg { width: 24px; height: 24px; }
.tbtn.back { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.zoom { display: flex; align-items: center; gap: 8px; }
.zoom output { min-width: 3.4em; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .95rem; }

.stage {
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  padding-block: 20px 60px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.doc { display: flex; flex-direction: column; align-items: center; gap: 22px; width: max-content; min-width: 100%; margin: 0 auto; }
.pg { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pg .no { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.paper { background: var(--paper); box-shadow: var(--shadow); color: #000; }
.paper > svg { display: block; }
.paper canvas { display: block; }
.paper.img img { display: block; max-width: none; }

/* docx-preview: drop its gray wrapper, keep its pages */
.docx-host .docx-wrapper { background: transparent !important; padding: 0 !important; gap: 22px; display: flex; flex-direction: column; align-items: center; }
.docx-host .docx-wrapper > section.docx { box-shadow: var(--shadow) !important; margin: 0 !important; }

/* spreadsheet */
.sheet-title { font-weight: 700; font-size: 1rem; color: var(--fg); align-self: flex-start; }
.paper.sheet { padding: 0; overflow: visible; }
.paper.sheet table { border-collapse: collapse; font-family: var(--body); font-size: 16px; }
.paper.sheet td, .paper.sheet th { border: 1px solid #c8ccc9; padding: 6px 10px; white-space: nowrap; vertical-align: top; }

/* status screens */
.status {
  max-width: 560px; margin: 48px auto; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 18px;
}
.status p { margin: 0; }
.status .big { font-size: 1.4rem; font-weight: 700; text-wrap: balance; }
.status .sub { color: var(--muted); }
.spinner {
  width: 56px; height: 56px; border-radius: 50%;
  border: 6px solid var(--accent-soft); border-top-color: var(--accent);
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.err { background: var(--warn-bg); color: var(--warn-fg); border-radius: 18px; padding: 24px 22px; display: grid; gap: 10px; }
.err .big { color: var(--warn-fg); }

.pw { gap: 16px; }
.pw .sub b { color: var(--fg); }
.pw-input {
  box-sizing: border-box; width: 100%; min-height: 76px; padding: 0 20px;
  font: inherit; font-size: 2rem; letter-spacing: .12em; text-align: center; font-variant-numeric: tabular-nums;
  color: var(--fg); background: var(--surface); border: 3px solid var(--line); border-radius: 18px;
}
.pw-input:focus { border-color: var(--accent); outline: none; }
.pw-go { width: 100%; box-sizing: border-box; min-height: 96px !important; font-size: 1.7rem !important; }
.pw-wrong { margin: 0; background: var(--warn-bg); color: var(--warn-fg); border-radius: 14px; padding: 12px 16px; font-weight: 700; }
.pw-kbd { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: 1rem; padding: 10px; min-height: 48px; cursor: pointer; }

.more {
  position: fixed; z-index: 15;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
}
.more-btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 14px;
  background: var(--surface); color: var(--muted); border: 1px solid var(--line); border-radius: 12px;
  font: inherit; font-size: .95rem; cursor: pointer;
}
.more-btn svg { width: 22px; height: 22px; }
.more-btn:hover { color: var(--fg); border-color: var(--accent); }
.more-menu {
  position: absolute; right: 0; top: calc(100% + 8px); min-width: 220px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column;
}
.more-item {
  display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px;
  border-radius: 10px; color: var(--fg); font-size: 1.05rem; cursor: pointer; white-space: nowrap;
}
.more-item:hover, .more-item:focus-visible { background: var(--accent-soft); }
.more-item svg { width: 24px; height: 24px; color: var(--accent); flex: none; }
.vbox {
  max-width: 560px; margin: 0 auto; box-sizing: border-box;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; text-align: center;
}
.vbox p { margin: 0; }
.vprev { width: 100%; max-height: 46vh; background: #000; border-radius: 16px; }
.vname { color: var(--muted); font-size: .95rem; overflow-wrap: anywhere; }
.vbig { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.vsub { color: var(--muted); }
.vprog { height: 22px; border-radius: 11px; background: var(--accent-soft); overflow: hidden; }
.vprog > div { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
.vwide { width: 100%; min-height: 72px; font-size: 1.2rem; }
#vscreen .pick { min-height: 96px; }

@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 3s; }
  .pick { transition: none; }
}
@media (max-width: 420px) {
  body { font-size: 19px; }
  .brand h1 { font-size: 1.85rem; }
  .pick { font-size: 2rem; min-height: 160px; }
  .tbtn .lbl { display: none; }
  .tbtn.back .lbl { display: inline; }
}
</style>
<style>
/* page basics (standalone) */
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
.tbtn.print { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--fg); }
@media (max-width: 420px) { .tbtn.print .lbl { display: inline; } }
.acts { display: flex; gap: 10px; }
@media (max-width: 520px) {
  .acts { flex: 1 1 100%; }
  .acts .tbtn { flex: 1 1 0; }
}
.sheet-back {
  position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .45);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet-card {
  box-sizing: border-box; width: 100%; max-width: 560px;
  background: var(--surface); color: var(--fg);
  border-radius: 24px 24px 0 0;
  padding-block: 26px calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; text-align: center;
}
.sheet-card p { margin: 0; }
.sheet-card .big { font-size: 1.4rem; font-weight: 700; }
.sheet-card .sub { color: var(--muted); }
.sheet-btn { min-height: 92px !important; font-size: 1.6rem !important; }
.sheet-btn2 { min-height: 72px; font-size: 1.2rem; width: 100%; }
.sheet-btn:disabled, .sheet-btn2:disabled { opacity: .6; }

/* printing: only the document pages */
@page { margin: 0; }
@media print {
  :root { padding: 0 !important; }
  body { background: #fff !important; }
  body::before, #home, .bar, #statusBox, .pg .no, .sheet-title, .sheet-back, #vscreen, .more { display: none !important; }
  .stage { padding: 0 !important; overflow: visible !important; }
  .doc { zoom: 1 !important; gap: 0 !important; width: auto !important; min-width: 0 !important; }
  .pg { break-after: page; page-break-after: always; gap: 0 !important; }
  .pg:last-child { break-after: auto; page-break-after: auto; }
  .paper, .docx-host .docx-wrapper > section.docx { box-shadow: none !important; }
  .docx-host .docx-wrapper { gap: 0 !important; }
  .docx-host .docx-wrapper > section.docx { break-after: page; }
  .paper > svg, .paper canvas, .paper.img img { max-width: 100% !important; height: auto !important; }
}
</style>
</head>
<body>


<input type="file" id="file" hidden
  accept=".hwp,.hwpx,.docx,.pdf,.xlsx,.xls,.csv,.jpg,.jpeg,.png,.gif,.webp,.heic,application/pdf,image/*">

<input type="file" id="videoFile" hidden accept="video/*,.mp4,.mov,.m4v,.3gp,.webm,.mkv">
<main id="home" class="home">
  <label for="file" class="pick" id="pickBtn" tabindex="0" role="button">문서 열기</label>
</main>

<div class="more" id="more">
  <button type="button" class="more-btn" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <span>기능</span>
  </button>
  <div class="more-menu" id="moreMenu" role="menu" hidden>
    <label for="videoFile" class="more-item" id="videoBtn" role="menuitem" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>
      동영상 줄이기
    </label>
  </div>
</div>

<section id="vscreen" hidden>
  <div class="bar">
    <button type="button" class="tbtn back" id="vBack" aria-label="처음 화면으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span class="lbl">뒤로</span>
    </button>
  </div>
  <div class="vbox">
    <video id="vPreview" class="vprev" controls playsinline preload="metadata"></video>
    <p class="vname" id="vName"></p>
    <p class="vbig" id="vSize"></p>
    <p class="vsub" id="vSub"></p>
    <div class="vprog" id="vProg" hidden><div id="vBar"></div></div>
    <button type="button" class="pick" id="vGo">줄이기</button>
    <button type="button" class="pick" id="vSave" hidden>저장하기</button>
    <button type="button" class="tbtn vwide" id="vShare" hidden>카카오톡 등으로 보내기</button>
    <button type="button" class="pw-kbd" id="vCancel" hidden>그만하기</button>
  </div>
</section>

<section id="viewer" hidden>
  <div class="bar">
    <button type="button" class="tbtn back" id="backBtn" aria-label="처음 화면으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span class="lbl">뒤로</span>
    </button>
    <div class="name" id="docName" hidden></div>
    <div class="zoom" role="group" aria-label="글씨 크기">
      <button type="button" class="tbtn" id="zoomOut" aria-label="글씨 작게">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
        <span class="lbl">작게</span>
      </button>
      <output id="zoomVal" hidden>100%</output>
      <button type="button" class="tbtn" id="zoomIn" aria-label="글씨 크게">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
        <span class="lbl">크게</span>
      </button>
    </div>
    <div class="acts">
      <button type="button" class="tbtn print" id="printBtn" aria-label="인쇄하기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>
        <span class="lbl">인쇄</span>
      </button>
      <button type="button" class="tbtn print" id="photoBtn" hidden aria-label="사진으로 저장">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg>
        <span class="lbl">사진으로 저장</span>
      </button>
    </div>
  </div>
  <div id="statusBox"></div>
  <div class="stage" id="stage"><div class="doc" id="doc"></div></div>
</section>

<div class="sheet-back" id="photoSheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="photoTitle">
    <p class="big" id="photoTitle">사진으로 바꿀까요?</p>
    <p class="sub" id="photoSub"></p>
    <button type="button" class="pick sheet-btn" id="photoSave">사진으로 저장</button>
    <button type="button" class="tbtn sheet-btn2" id="photoShare" hidden>카카오톡 등으로 보내기</button>
    <button type="button" class="pw-kbd" id="photoCancel">닫기</button>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const home = $('home'), viewer = $('viewer'), docEl = $('doc'), stage = $('stage'), statusBox = $('statusBox');
  const fileInput = $('file');

  /* ---------- small helpers ---------- */
  const scriptCache = {};
  function loadScript(src) {
    if (!scriptCache[src]) {
      scriptCache[src] = new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = src; s.onload = res; s.onerror = () => rej(new Error('script ' + src));
        document.head.appendChild(s);
      });
    }
    return scriptCache[src];
  }
  const LIB = {
    jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
    docx: 'https://cdn.jsdelivr.net/npm/docx-preview@0.3.6/dist/docx-preview.min.js',
    pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const tick = () => new Promise((r) => setTimeout(r, 0));

  /* ---------- zoom ---------- */
  const STEPS = [0.75, 1, 1.25, 1.5, 2, 2.5, 3];

  let fitMode = 'fit';      // 'fit' scales pages to screen width; 'natural' keeps 1:1 (tables)
  let naturalWidth = 0;     // widest page in CSS px

  function applyZoom() {
    const user = STEPS[zi];

    $('zoomOut').disabled = zi === 0;
    $('zoomIn').disabled = zi === STEPS.length - 1;
  }
  $('zoomIn').onclick = () => { if (zi < STEPS.length - 1) { zi++; store.set('zoom', STEPS[zi]); applyZoom(); } };

  /* ---------- screens ---------- */
  let currentPdf = null, currentName = '';

  /* password prompt: resolves with what the person typed */

  /* ---------- page helpers ---------- */
  function addPage(content, i, total, cls = '') {
    const pg = document.createElement('div');
    pg.className = 'pg';
    if (total > 1) pg.innerHTML = `<div class="no">${total}쪽 중 ${i + 1}쪽</div>`;
    const paper = document.createElement('div');
    paper.className = 'paper ' + cls;

    pg.appendChild(paper);
    docEl.appendChild(pg);
    return paper;
  }

  /* ---------- detect type ---------- */
  async function detect(file, bytes) {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const known = { hwp: 'hwp', hwpx: 'hwpx', docx: 'docx', pdf: 'pdf', xlsx: 'xlsx', xls: 'xlsx', csv: 'xlsx',
      jpg: 'img', jpeg: 'img', png: 'img', gif: 'img', webp: 'img', bmp: 'img', heic: 'img', doc: 'doc', ppt: 'ppt', pptx: 'ppt' };
    if (known[ext]) return known[ext];
    if (file.type && file.type.startsWith('image/')) return 'img';
    const b = bytes;
    if (b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46) return 'pdf';
    if (b[0] === 0xD0 && b[1] === 0xCF && b[2] === 0x11 && b[3] === 0xE0) return 'hwp'; // HWP 5 (also old .doc/.xls)
    if (b[0] === 0x50 && b[1] === 0x4B) {
      try {
        await loadScript(LIB.jszip);
        const z = await JSZip.loadAsync(bytes);
        const names = Object.keys(z.files);
        if (names.some((n) => n.startsWith('Contents/'))) return 'hwpx';
        if (names.some((n) => n.startsWith('word/'))) return 'docx';
        if (names.some((n) => n.startsWith('xl/'))) return 'xlsx';
        if (names.some((n) => n.startsWith('ppt/'))) return 'ppt';
      } catch {}
    }
    return 'unknown';
  }

  /* ---------- HWP / HWPX ---------- */
  let rhwpReady = null;
  function initRhwp() {
    if (!rhwpReady) {
      let ctx = null, last = '';
      globalThis.measureTextWidth = (font, text) => {
        if (!ctx) ctx = document.createElement('canvas').getContext('2d');
        if (font !== last) { ctx.font = font; last = font; }
        return ctx.measureText(text).width;
      };
      rhwpReady = (async () => {
        await Promise.all(['400 16px "Noto Serif KR"', '700 16px "Noto Serif KR"', '400 16px "Noto Sans KR"',
          '700 16px "Noto Sans KR"', '16px "Nanum Gothic"', '16px "Nanum Myeongjo"']
          .map((f) => document.fonts.load(f, '가').catch(() => {})));
        const mod = await import(new URL('./rhwp.js', document.baseURI).href);
        await mod.default({ module_or_path: new URL('./rhwp_bg.wasm', document.baseURI).href });
        return mod;
      })();
      rhwpReady.catch(() => { rhwpReady = null; });
    }
    return rhwpReady;
  }
  function scopeIds(svg, p) {
    return svg
      .replace(/\sid="([^"]+)"/g, ` id="p${p}-$1"`)
      .replace(/url\(#([^)]+)\)/g, `url(#p${p}-$1)`)
      .replace(/href="#([^"]+)"/g, `href="#p${p}-$1"`);
  }
  async function renderHwp(bytes) {
    busy('한글 문서를 여는 중이에요', '처음 한 번은 준비하느라 조금 걸릴 수 있어요.');
    const mod = await initRhwp();
    let doc;
    try { doc = new mod.HwpDocument(bytes); }
    catch (e) {
      const m = String(e && (e.message || e));
      if (!/비밀번호|암호|password|encrypt/i.test(m)) throw e;
      let wrong = false;
      while (!doc) {
        const pw = await askPassword(wrong);
        busy('한글 문서를 여는 중이에요');
        try { doc = mod.HwpDocument.openWithPassword(bytes, pw); }
        catch (e2) {
          const m2 = String(e2 && (e2.message || e2));
          if (/일치하지|암호 오류|password/i.test(m2)) { wrong = true; continue; }
          if (/DRM|지원하지/.test(m2)) throw new UserError('보안 프로그램이 걸린 문서라 열 수 없어요', '보내준 분께 PDF로 다시 보내 달라고 부탁해 보세요.');
          throw e2;
        }
      }
    }
    const total = doc.pageCount();
    for (let i = 0; i < total; i++) {
      const svg = scopeIds(doc.renderPageSvg(i), i);
      const paper = addPage(svg, i, total);
      const el = paper.firstElementChild;
      const w = parseFloat(el && el.getAttribute('width')) || 794;
      naturalWidth = Math.max(naturalWidth, w);
      if (i === 0) { done(); applyZoom(); }
      if (i % 3 === 2) await tick();
    }
    try { doc.free(); } catch {}
    applyZoom();
  }

  /* ---------- DOCX ---------- */
  async function renderDocx(bytes) {
    busy('워드 문서를 여는 중이에요');
    await loadScript(LIB.jszip);
    await loadScript(LIB.docx);
    const host = document.createElement('div');
    host.className = 'docx-host';
    docEl.appendChild(host);
    await docx.renderAsync(bytes, host, null, {
      inWrapper: true, breakPages: true, ignoreLastRenderedPageBreak: false,
      experimental: true, renderHeaders: true, renderFooters: true, useBase64URL: true,
    });
    done();
    host.querySelectorAll('section.docx').forEach((s) => { naturalWidth = Math.max(naturalWidth, s.offsetWidth); });
    applyZoom();
  }

  /* ---------- PDF ---------- */
  async function renderPdf(bytes) {
    busy('PDF 문서를 여는 중이에요');
    await loadScript(LIB.pdf);
    const pdfjs = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
    pdfjs.GlobalWorkerOptions.workerSrc = new URL('./pdf.worker.min.js', document.baseURI).href;
    let pdf = null, password, wrong = false;
    while (!pdf) {
      try {
        pdf = await pdfjs.getDocument({ data: bytes.slice(), password, isEvalSupported: false }).promise;
      } catch (e) {
        if (!e || e.name !== 'PasswordException') throw e;
        wrong = password !== undefined;
        password = await askPassword(wrong);
        busy('PDF 문서를 여는 중이에요');
      }
    }
    currentPdf = pdf;
    const total = pdf.numPages;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (let i = 1; i <= total; i++) {
      const page = await pdf.getPage(i);
      const vp1 = page.getViewport({ scale: 1 });
      const scale = 2 * dpr;
      const vp = page.getViewport({ scale });
      const c = document.createElement('canvas');
      c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      c.style.width = vp1.width + 'px'; c.style.height = vp1.height + 'px';
      addPage(c, i - 1, total);
      naturalWidth = Math.max(naturalWidth, vp1.width);
      if (i === 1) { done(); applyZoom(); }
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
    applyZoom();
  }

  /* ---------- PDF → 사진(JPG) ---------- */
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let photoFiles = null;
  async function pdfToJpgs(onProgress) {
    const pdf = currentPdf, base = currentName.replace(/\.[^.]+$/, '') || '문서';
    const out = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      onProgress(i, pdf.numPages);
      const page = await pdf.getPage(i);
      const vp1 = page.getViewport({ scale: 1 });
      const scale = Math.max(1.5, Math.min(2.5, 2000 / Math.max(vp1.width, vp1.height)));
      const vp = page.getViewport({ scale });
      const c = document.createElement('canvas');
      c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.92));
      const name = pdf.numPages > 1 ? `${base}_${i}쪽.jpg` : `${base}.jpg`;
      out.push(new File([blob], name, { type: 'image/jpeg' }));
      c.width = c.height = 0;
    }
    return out;
  }
  function canShareFiles(files) {
    try { return !!(navigator.canShare && navigator.canShare({ files })); } catch { return false; }
  }
  async function downloadAll(files) {
    for (const f of files) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f); a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      await new Promise((r) => setTimeout(r, 400));
    }
  }
  async function ensurePhotos() {
    if (photoFiles) return photoFiles;
    const save = $('photoSave'), share = $('photoShare');
    save.disabled = share.disabled = true;
    try {
      photoFiles = await pdfToJpgs((i, n) => { $('photoSub').textContent = `사진으로 바꾸는 중이에요 (${n}쪽 중 ${i}쪽)`; });
    } finally { save.disabled = share.disabled = false; }
    return photoFiles;
  }
  $('photoBtn').onclick = () => {
    if (!currentPdf) return;
    photoFiles = null;
    const n = currentPdf.numPages;

    $('photoSheet').hidden = false;
    $('photoSave').focus();
  };
  $('photoCancel').onclick = () => { $('photoSheet').hidden = true; };
  $('photoSheet').addEventListener('click', (e) => { if (e.target.id === 'photoSheet') $('photoSheet').hidden = true; });
  $('photoSave').onclick = async () => {
    try {
      const files = await ensurePhotos();
      if (isIOS && canShareFiles(files)) {
        $('photoSub').textContent = '다음 화면에서 "이미지 저장"을 눌러 주세요.';
        await navigator.share({ files });
      } else {
        await downloadAll(files);
      }
      $('photoTitle').textContent = '사진으로 저장했어요';
      $('photoSub').textContent = isIOS ? '사진 앱에서 확인하실 수 있어요.' : '갤러리의 "다운로드" 앨범에서 확인하실 수 있어요.';
    } catch (e) {
      if (e && e.name === 'AbortError') { $('photoSub').textContent = '저장을 취소했어요.'; return; }
      console.error(e);
      $('photoSub').textContent = '사진으로 바꾸지 못했어요. 다시 눌러 주세요.';

  };
  $('photoShare').onclick = async () => {
    try {
      const files = await ensurePhotos();
      if (!canShareFiles(files)) { $('photoSub').textContent = '이 기기에서는 바로 보낼 수 없어요. "사진으로 저장"을 눌러 주세요.'; return; }
      $('photoSub').textContent = '보낼 곳으로 카카오톡을 고르세요.';

      if (e && e.name === 'AbortError') { $('photoSub').textContent = '보내기를 취소했어요.'; return; }

      $('photoSub').textContent = '보내지 못했어요. 다시 눌러 주세요.';
    }
  };

  /* ---------- Spreadsheet ---------- */
  async function renderSheet(bytes) {
    busy('엑셀 표를 여는 중이에요');
    await loadScript(LIB.xlsx);
    let wb;
    try { wb = XLSX.read(bytes, { type: 'array' }); }
    catch (e) {
      if (/password|encrypt/i.test(String(e && e.message))) throw new UserError('비밀번호가 걸린 엑셀은 아직 못 열어요', '보내준 분께 비밀번호 없이, 또는 PDF로 다시 보내 달라고 부탁해 보세요.');
      throw e;
    }
    fitMode = 'natural';
    const total = wb.SheetNames.length;
    wb.SheetNames.forEach((name, i) => {
      const html = XLSX.utils.sheet_to_html(wb.Sheets[name], { header: '', footer: '' });
      const pg = document.createElement('div');
      pg.className = 'pg';
      pg.style.alignItems = 'flex-start';
      if (total > 1) pg.innerHTML = `<div class="sheet-title">${esc(name)}</div>`;
      const paper = document.createElement('div');
      paper.className = 'paper sheet';
      paper.innerHTML = html;
      pg.appendChild(paper);
      docEl.appendChild(pg);
    });
    docEl.style.alignItems = 'flex-start';
    done(); applyZoom();
  }

  /* ---------- Image ---------- */
  async function renderImage(file) {
    busy('사진을 여는 중이에요');
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.alt = file.name;
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new UserError('이 사진은 열 수 없어요', '아이폰의 HEIC 사진이라면 카카오톡에서 사진으로 다시 받아 보세요.')); img.src = url; });
    addPage(img, 0, 1, 'img');
    naturalWidth = img.naturalWidth;
    done(); applyZoom();
  }

  /* ---------- main ---------- */
  class UserError extends Error { constructor(msg, sub) { super(msg); this.sub = sub; } }

  async function openFile(file) {
    if (!file) return;
    if (isVideo(file)) { openVideo(file); return; }
    showViewer(file.name);
    docEl.style.alignItems = '';
    busy('문서를 확인하는 중이에요');
    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const kind = await detect(file, bytes);
      if (kind === 'hwp' || kind === 'hwpx') await renderHwp(bytes);
      else if (kind === 'docx' && bytes[0] === 0xD0 && bytes[1] === 0xCF) throw new UserError('비밀번호가 걸린 워드 문서는 아직 못 열어요', '보내준 분께 비밀번호 없이, 또는 PDF로 다시 보내 달라고 부탁해 보세요.');
      else if (kind === 'docx') await renderDocx(bytes);
      else if (kind === 'pdf') { await renderPdf(bytes); $('photoBtn').hidden = !currentPdf; }
      else if (kind === 'xlsx') await renderSheet(bytes);
      else if (kind === 'img') await renderImage(file);
      else if (kind === 'doc') throw new UserError('예전 워드 문서(.doc)는 아직 못 열어요', '보내준 분께 .docx나 PDF로 다시 보내 달라고 부탁해 보세요.');
      else if (kind === 'ppt') throw new UserError('발표 자료(파워포인트)는 아직 못 열어요', '보내준 분께 PDF로 다시 보내 달라고 부탁해 보세요.');
      else throw new UserError('이 문서는 열 수 없어요', '한글, 워드, PDF, 엑셀, 사진만 열 수 있어요. 자녀에게 문서를 보내 보세요.');
    } catch (e) {
      console.error(e);
      if (e instanceof UserError) fail(e.message, e.sub);
      else fail('문서를 여는 데 실패했어요', '문서가 손상되었거나 아직 지원하지 않는 모양일 수 있어요. 자녀에게 문서를 보내 보세요.');
    }
  }

  fileInput.addEventListener('change', () => openFile(fileInput.files[0]));
  $('pickBtn').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
  /* files shared from other apps (Android share sheet → sw.js) */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  (async () => {
    const q = new URLSearchParams(location.search).get('shared');
    if (!q) return;
    history.replaceState(null, '', location.pathname);
    if (q !== '1') { showViewer('공유된 문서'); fail('문서를 받지 못했어요', '카카오톡에서 다시 공유해 보세요.'); return; }
    try {
      const cache = await caches.open('shared-file-v1');
      const key = new URL('./__shared__', location.href).href;
      const res = await cache.match(key);
      if (!res) return;
      const name = decodeURIComponent(res.headers.get('X-File-Name') || '문서');
      const blob = await res.blob();
      await cache.delete(key);
      openFile(new File([blob], name, { type: blob.type }));
    } catch { showViewer('공유된 문서'); fail('문서를 받지 못했어요', '카카오톡에서 다시 공유해 보세요.'); }
  })();

  /* ---------- 동영상 줄이기 (WebCodecs, 기기 안에서 처리) ---------- */
  const MB_URL = 'https://cdn.jsdelivr.net/npm/mediabunny@1.61.1/dist/bundles/mediabunny.min.mjs';
  const vs = $('vscreen');
  let vFile = null, vResult = null, vConv = null, vUrl = null, wakeLock = null;
  function isVideo(f) {
    return (f.type && f.type.startsWith('video/')) || /\.(mp4|mov|m4v|3gp|webm|mkv)$/i.test(f.name);
  }
  function fmtSize(n) {
    if (n >= 1024 * 1024 * 1024) return (n / 1024 / 1024 / 1024).toFixed(1) + 'GB';
    if (n >= 1024 * 1024) return Math.round(n / 1024 / 1024) + 'MB';
    return Math.max(1, Math.round(n / 1024)) + 'KB';
  }
  function setPreview(blob) {
    if (vUrl) URL.revokeObjectURL(vUrl);
    vUrl = URL.createObjectURL(blob);
    $('vPreview').src = vUrl;
  }
  function vState(st) {
    $('vGo').hidden = st !== 'ready';
    $('vProg').hidden = st !== 'busy';
    $('vCancel').hidden = st !== 'busy';
    $('vSave').hidden = $('vShare').hidden = st !== 'done';
    if (st === 'done') $('vShare').hidden = !navigator.share;
  }
  async function keepAwake(on) {
    try {
      if (on && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen');
      else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch {}
  }
  function openVideo(file) {
    dropPdf();
    vFile = file; vResult = null;
    home.hidden = true; viewer.hidden = true; vs.hidden = false;
    window.scrollTo(0, 0);
    setPreview(file);
    $('vName').textContent = file.name;
    $('vSize').textContent = '지금 크기 ' + fmtSize(file.size);
    $('vSub').textContent = '카카오톡으로 보내기 좋은 크기로 줄여 드려요.';
    $('vBar').style.width = '0';
    vState('ready');
  }
  async function closeVideo() {
    if (vConv) { try { await vConv.cancel(); } catch {} vConv = null; }
    keepAwake(false);
    $('vPreview').removeAttribute('src'); $('vPreview').load();
    if (vUrl) { URL.revokeObjectURL(vUrl); vUrl = null; }
    vFile = vResult = null;
    vs.hidden = true; home.hidden = false;
    $('videoFile').value = ''; fileInput.value = '';
  }
  $('vBack').onclick = closeVideo;
  $('videoFile').addEventListener('change', () => { const f = $('videoFile').files[0]; if (f) openVideo(f); });
  const moreMenu = $('moreMenu'), moreBtn = $('moreBtn');
  new MutationObserver(() => { $('more').hidden = home.hidden; setMenu(false); }).observe(home, { attributes: true, attributeFilter: ['hidden'] });
  function setMenu(open) { moreMenu.hidden = !open; moreBtn.setAttribute('aria-expanded', String(open)); }
  moreBtn.onclick = (e) => { e.stopPropagation(); setMenu(moreMenu.hidden); };
  document.addEventListener('click', (e) => { if (!moreMenu.hidden && !$('more').contains(e.target)) setMenu(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
  $('videoBtn').addEventListener('click', () => setMenu(false));
  $('videoBtn').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('videoFile').click(); } });

  $('vGo').onclick = async () => {
    if (!vFile) return;
    $('vPreview').pause();
    vState('busy');
    $('vSize').textContent = '0%';
    $('vSub').textContent = '줄이는 중이에요. 화면을 끄지 말고 기다려 주세요.';
    keepAwake(true);
    try {
      const mb = await import(MB_URL);
      let codec = null;
      for (const c of ['avc', 'vp9']) { if (await mb.canEncodeVideo(c)) { codec = c; break; } }
      if (!codec) throw Object.assign(new Error('no encoder'), { user: '이 휴대폰(브라우저)에서는 동영상을 줄일 수 없어요. 크롬 최신 버전에서 다시 해 보세요.' });

      const input = new mb.Input({ source: new mb.BlobSource(vFile), formats: mb.ALL_FORMATS });
      const output = new mb.Output({ format: new mb.Mp4OutputFormat({ fastStart: 'in-memory' }), target: new mb.BufferTarget() });
      const conv = await mb.Conversion.init({
        input, output, tracks: 'primary',
        video: (track) => {
          const w = track.displayWidth, h = track.displayHeight;
          const LONG = 1280;
          const opts = { codec, frameRate: 30, forceTranscode: true, keyFrameInterval: 4 };
          if (Math.max(w, h) > LONG) { if (w >= h) opts.width = LONG; else opts.height = LONG; }
          const ow = opts.width ? LONG : opts.height ? Math.round(w * LONG / h) : w;
          const oh = opts.height ? LONG : opts.width ? Math.round(h * LONG / w) : h;
          opts.bitrate = Math.round(Math.min(2_500_000, Math.max(600_000, ow * oh * 30 * 0.07)));
          return opts;
        },
        audio: async () => ((await mb.canEncodeAudio('aac')) ? { codec: 'aac', bitrate: 96_000 } : {}),
      });
      if (!conv.utilizedTracks.some((t) => t.type === 'video')) {
        throw Object.assign(new Error('video track dropped'), { user: '이 휴대폰(브라우저)에서는 이 동영상 형식을 줄일 수 없어요. 크롬 최신 버전에서 다시 해 보세요.' });
      }
      if (!conv.isValid) {
        throw Object.assign(new Error('invalid'), { user: '이 동영상은 줄일 수 없는 형식이에요.' });
      }
      vConv = conv;
      conv.onProgress = (p) => {
        const pct = Math.min(99, Math.floor(p * 100));
        $('vSize').textContent = pct + '%';
        $('vBar').style.width = pct + '%';
      };
      await conv.execute();
      vConv = null;
      const lostAudio = conv.discardedTracks.some((d) => d.track.type === 'audio');
      const out = new Blob([output.target.buffer], { type: 'video/mp4' });
      const base = vFile.name.replace(/\.[^.]+$/, '') || '동영상';
      if (out.size >= vFile.size * 0.95) {
        vResult = new File([vFile], vFile.name, { type: vFile.type || 'video/mp4' });
        $('vSize').textContent = fmtSize(vFile.size);
        $('vSub').textContent = '이미 충분히 작은 동영상이에요. 원래 동영상을 그대로 쓰셔도 돼요.';
      } else {
        vResult = new File([out], base + '_줄임.mp4', { type: 'video/mp4' });
        const saved = Math.round((1 - out.size / vFile.size) * 100);
        $('vSize').textContent = `${fmtSize(vFile.size)} → ${fmtSize(out.size)}`;
        $('vSub').textContent = `${saved}% 줄었어요.` + (lostAudio ? ' 이 휴대폰에서는 소리를 함께 넣지 못했어요.' : '');
        setPreview(vResult);
      }
      $('vBar').style.width = '100%';
      vState('done');
    } catch (e) {
      vConv = null;
      if (e && e.name === 'ConversionCanceledError') return;
      console.error(e);
      $('vSize').textContent = '줄이지 못했어요';
      $('vSub').textContent = (e && e.user) || '동영상이 너무 길거나 지원하지 않는 형식일 수 있어요. 다시 눌러 보세요.';
      vState('ready');
    } finally { keepAwake(false); }
  };
  $('vCancel').onclick = async () => {
    if (vConv) { try { await vConv.cancel(); } catch {} vConv = null; }
    $('vSize').textContent = '지금 크기 ' + fmtSize(vFile.size);
    $('vSub').textContent = '줄이기를 멈췄어요.';
    $('vBar').style.width = '0';
    vState('ready');
  };
  $('vSave').onclick = async () => {
    if (!vResult) return;
    try {
      if (isIOS && canShareFiles([vResult])) {
        $('vSub').textContent = '다음 화면에서 "비디오 저장"을 눌러 주세요.';
        await navigator.share({ files: [vResult] });
      } else {
        await downloadAll([vResult]);
        $('vSub').textContent = '저장했어요. 갤러리의 "다운로드" 앨범에서 확인하실 수 있어요.';
      }
    } catch (e) { if (!e || e.name !== 'AbortError') $('vSub').textContent = '저장하지 못했어요. 다시 눌러 주세요.'; }
  };
  $('vShare').onclick = async () => {
    if (!vResult) return;
    try {
      if (!canShareFiles([vResult])) { $('vSub').textContent = '이 기기에서는 바로 보낼 수 없어요. "저장하기"를 눌러 주세요.'; return; }
      await navigator.share({ files: [vResult] });
    } catch (e) { if (!e || e.name !== 'AbortError') $('vSub').textContent = '보내지 못했어요. 다시 눌러 주세요.'; }
  };

  /* drag & drop on desktop */
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (f) openFile(f);
  });
})();
</script>

</body>
</html>
